version: 2

# Without this file the only dependency movement is GitHub's automated security
# fixes, which can patch a dependency only when it can resolve one directly. A
# transitive advisory that needs its parent bumped never becomes a pull request,
# which is how this repository accumulated dozens of open alerts with none open.
#
# Grouped deliberately: ungrouped, a backlog this size opens dozens of pull
# requests that each rewrite the lockfile, so all but the first conflict and the
# queue never drains. One pull request per group rewrites it once.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Majors are excluded from every group so they arrive as their own pull
    # request. dependabot/fetch-metadata reports a grouped PR's update-type as
    # major if *any* member is a major, and the auto-merge workflow refuses
    # majors -- so a single major in a group silently blocks the whole batch,
    # including the security patches travelling with it. Observed directly: a
    # 43-package development group held for days behind one Angular major.
    groups:
      # Angular ships its packages as a set and expects them to move together --
      # compiler-cli in particular has to match compiler exactly -- so splitting
      # them across pull requests produces a tree that cannot resolve.
      # Every Angular-adjacent scope, listed explicitly: '@angular*' does not
      # match '@angular/core', because the wildcard does not cross the '/'
      # separator. That silently matched nothing, so the packages fell through
      # to the production/development groups and Angular was split across two
      # pull requests -- @angular/core in one, @angular/compiler-cli in the
      # other. compiler-cli must match compiler exactly, so whichever merged
      # first broke the build with
      # 'this.tcb.boundTarget.getForeignComponent is not a function'.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@angular-eslint/*'
          - '@angular-builders/*'
          - '@ngtools/*'
          - '@schematics/*'
        update-types: ['minor', 'patch']
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
        update-types: ['minor', 'patch']
      production:
        dependency-type: production
        update-types: ['minor', 'patch']
      development:
        dependency-type: development
        update-types: ['minor', 'patch']
    # Majors are intentionally NOT ignored here. The auto-merge workflow already
    # refuses to merge them, so letting Dependabot raise them is what surfaces a
    # major for review rather than hiding it -- ignoring them here would mean
    # never learning the upgrade exists.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Majors are excluded from every group so they arrive as their own pull
    # request. dependabot/fetch-metadata reports a grouped PR's update-type as
    # major if *any* member is a major, and the auto-merge workflow refuses
    # majors -- so a single major in a group silently blocks the whole batch,
    # including the security patches travelling with it. Observed directly: a
    # 43-package development group held for days behind one Angular major.
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']

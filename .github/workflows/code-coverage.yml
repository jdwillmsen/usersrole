name: Code Coverage
on:
  push:
    branches:
      - develop
permissions:
  contents: read
# One run per branch: a second push replaces the first rather than queueing
# behind it. Without this, superseded runs still consume the account-wide job
# limit while producing results nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress-install:
    runs-on: ubuntu-22.04
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
      - name: Create Environment Files
        run: node server.js && node server-cypress.js
        env:
          ENVIRONMENT_FILE: ${{ secrets.ENVIRONMENT_FILE }}
          ACCOUNTS_FILE: ${{ secrets.ACCOUNTS_FILE }}
      - name: Cypress Install
        uses: cypress-io/github-action@v7
        with:
          runTests: false
          build: npm run build
      - name: Save Build Folder
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build
          if-no-files-found: error
          path: dist
  jest:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
      - name: Create Environment File
        run: node server.js
        env:
          ENVIRONMENT_FILE: ${{ secrets.ENVIRONMENT_FILE }}
      - name: Install Dependencies
        run: npm ci
      - name: Jests Tests
        run: npm run jest:coverage
      - name: Save Coverage Folder
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-jest
          if-no-files-found: error
          path: coverage/
  cypress-e2e:
    runs-on: ubuntu-22.04
    needs: cypress-install
    strategy:
      fail-fast: false
      matrix:
        containers: [ 1, 2 ]
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: Download Build Folder
        uses: actions/download-artifact@v8.0.1
        with:
          name: build
      - name: Setup Node
        uses: actions/setup-node@v7
      - name: Create Environment Files
        run: node server.js && node server-cypress.js
        env:
          ENVIRONMENT_FILE: ${{ secrets.ENVIRONMENT_FILE }}
          ACCOUNTS_FILE: ${{ secrets.ACCOUNTS_FILE }}
      - name: Cypress Run
        uses: cypress-io/github-action@v7
        with:
          record: true
          parallel: true
          group: E2E
          start: npm start
          wait-on: npx wait-on --timeout 300000 http://localhost:4200
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Namespace Coverage Output
        run: if [ -d coverage/cypress ]; then mv coverage/cypress coverage/cypress-e2e-${{ matrix.containers }}; fi
      - name: Save Coverage Folder
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-e2e-${{ matrix.containers }}
          if-no-files-found: ignore
          path: coverage/
  code-coverage:
    runs-on: ubuntu-22.04
    # Pushes the badge update commit back to the branch.
    permissions:
      contents: write
    needs:
      - jest
      - cypress-e2e
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: Download Coverage Folder
        uses: actions/download-artifact@v8.0.1
        # v4 forbids duplicate artifact names, so the matrix jobs now upload
        # per-container artifacts (coverage-ct-*, coverage-e2e-*). Merge them
        # back into a single coverage/ tree for the merge step below.
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage
      - name: Setup Node
        uses: actions/setup-node@v7
      # nyc resolves the @istanbuljs/nyc-config-typescript preset from
      # node_modules, so the report steps need the dev dependencies installed.
      - name: Install Dependencies
        run: npm ci
      - name: Merge Coverage Reports
        run: npm run merge:coverage
      - name: Generate Merged Coverage Report
        run: npm run all:coverage
      - name: Update Code Coverage Badge
        run: npx update-badge --from /home/runner/work/usersrole/usersrole/coverage/merged-report/coverage-summary.json
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          # head_ref is only set on pull_request events; this workflow runs on
          # push, so use ref_name. Skip CI on the badge commit to avoid retrigger.
          commit_message: Apply code coverage badge update [skip ci]
          branch: ${{ github.ref_name }}

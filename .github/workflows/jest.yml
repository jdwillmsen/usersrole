name: Jest
on:
  push:
    branches-ignore:
      - main
permissions:
  contents: read
# One run per branch: a second push replaces the first rather than queueing
# behind it. Without this, superseded runs still consume the account-wide job
# limit while producing results nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
      - name: Create Environment File
        run: node server.js
        env:
          ENVIRONMENT_FILE: '${{ secrets.ENVIRONMENT_FILE }}'
          ALLOW_ENV_TEMPLATE_FALLBACK: 'true'
      - name: Install Dependencies
        run: npm ci
      - name: Jests Tests
        run: npm run jest

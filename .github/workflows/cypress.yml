name: Cypress Component & E2E Tests
on:
  push:
    branches-ignore:
      - main
      - develop
permissions:
  contents: read
# One run per branch. Without this a second push queues behind the first
# instead of replacing it, and this workflow alone asks for 26 jobs -- more
# than the whole account may run at once -- so every superseded run starves
# every other repository until it finishes work nobody wants any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-26.04
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
      - name: Create Environment Files
        run: node server.js && node server-cypress.js
        env:
          ENVIRONMENT_FILE: ${{ secrets.ENVIRONMENT_FILE }}
          ACCOUNTS_FILE: ${{ secrets.ACCOUNTS_FILE }}
          ALLOW_ENV_TEMPLATE_FALLBACK: 'true'
      - name: Cypress Install
        uses: cypress-io/github-action@v7
        with:
          runTests: false
          build: npm run build
      - name: Save Build Folder
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build
          if-no-files-found: error
          path: dist
  cypress-run-e2e:
    # Dependabot PRs can't access CYPRESS_RECORD_KEY; skip recorded runs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    needs: install
    strategy:
      fail-fast: false
      matrix:
        containers: [ 1, 2 ]
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: Download Build Folder
        uses: actions/download-artifact@v8.0.1
        with:
          name: build
      - name: Setup Node
        uses: actions/setup-node@v7
      - name: Create Environment Files
        run: node server.js && node server-cypress.js
        env:
          ENVIRONMENT_FILE: ${{ secrets.ENVIRONMENT_FILE }}
          ACCOUNTS_FILE: ${{ secrets.ACCOUNTS_FILE }}
          ALLOW_ENV_TEMPLATE_FALLBACK: 'true'
      - name: Cypress Run
        uses: cypress-io/github-action@v7
        with:
          record: true
          parallel: true
          group: E2E
          start: npm start
          wait-on: npx wait-on --timeout 600000 http://localhost:4200
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

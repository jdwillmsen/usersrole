name: Format
on:
  push:
    branches-ignore:
      - main
# One run per branch: a second push replaces the first rather than queueing
# behind it. Without this, superseded runs still consume the account-wide job
# limit while producing results nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v7
      - name: Install Dependencies
        run: npm ci
      - name: Format Code
        run: npm run format
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Apply formatting changes
          branch: ${{ github.head_ref }}
